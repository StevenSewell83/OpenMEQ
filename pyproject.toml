[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openmeq"
version = "0.1.0"
description = "Open-source pipeline for microearthquake detection, location, and relocation."
requires-python = ">=3.10,<3.11"
dependencies = [
    "click",
    "pydantic>=2",
    "PyYAML",
    "obspy",
    "numpy==1.26.4",
    "scipy",
    "pandas",
    "matplotlib",
    "tqdm",
    # Installed here (PLAN.md §2 step 2) so `install.sh`'s PhaseNet/ObsPyck
    # steps only need to clone sources and pin model weights, not resolve
    # these; the pin matches PhaseNet's own requirements.txt (AI4EPS/PhaseNet
    # at the commit pinned in install.sh).
    "tensorflow==2.11.0",
    "PyQt5",
    "obspyck",
    # obspyck.util.gk2lonlat imports pyproj lazily and crashes with
    # ModuleNotFoundError without it; obspyck itself does not declare it as
    # a dependency. Confirmed missing during the OpenMEQ-c3l.1 spike -- see
    # docs/obspyck_notes.md.
    "pyproj",
]

[project.scripts]
openmeq = "openmeq.cli:main"

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff==0.16.9", "tomli; python_version < '3.11'"]

[tool.setuptools.packages.find]
include = ["openmeq*"]

# M7.2 / OpenMEQ-c3l.2: openmeq/review/obspyck_config.py splices ObsPyck's
# own shipped example.cfg (a packaged copy) into the generated ini's
# [keys]/[misc]/[gui_defaults]/[matplotlibrc]/[ar_picker] sections.
[tool.setuptools.package-data]
openmeq = ["review/data/*.cfg"]

# Line length and rule sets are the repo-wide baseline (documented here so
# later contributors don't have to guess): 100 cols matches the surrounding
# scientific-Python ecosystem (numpy/scipy/pandas all use 88-100), and
# E/F/I/UP/B cover pyflakes errors, import sorting, pyupgrade modernization,
# and bugbear's common-mistake checks without being overly strict.
[tool.ruff]
line-length = 100
# *.md: docs quote third-party code verbatim (e.g. the hypoddpy audit); never lint/format it.
extend-exclude = [".claude", "external", "runs", "*.md", ".pytest_tmp"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Per-checkout temp dir (under /home, not the shared /tmp): parallel worktrees can't
# prune each other's session fixtures, and each ~500 MB synthetic dataset stays
# off the small root filesystem. pytest clears it at the start of every run.
addopts = "--basetemp=.pytest_tmp"
# Delete per-test tmp_path dirs of passing tests (conftest also removes the whole
# basetemp after a fully passing run).
tmp_path_retention_policy = "failed"
markers = [
    "requires_nlloc: needs a working NonLinLoc install in external/bin",
    "requires_hypodd: needs a working hypoDD install in external/bin",
    "requires_phasenet: needs the PhaseNet clone/model in external/",
    "requires_gui: needs a display (e.g. for ObsPyck review) to run",
    "slow: long-running test, skip for quick local iteration",
]
